name: Publish Monorepo Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (core, data-v5..v8, v5..v8, latest, compatible, all)'
        required: true
        default: 'all'
      test-pypi:
        description: 'Publish to TestPyPI first?'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Validate package versions match tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          echo "Release tag: $TAG — expected package version: $EXPECTED"

          FAIL=0
          for pkg in core data-v5 data-v6 data-v7 data-v8 v5 v6 v7 v8 latest compatible; do
            PKG_VER=$(grep '^version = ' packages/$pkg/pyproject.toml | cut -d'"' -f2)
            if [ "$PKG_VER" != "$EXPECTED" ]; then
              echo "❌ packages/$pkg: $PKG_VER != $EXPECTED"
              FAIL=1
            else
              echo "✅ packages/$pkg: $PKG_VER"
            fi
          done

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "ERROR: Package versions do not match release tag '$TAG'."
            echo "Run: python scripts/bump-version.py $EXPECTED, commit, re-tag, and re-publish."
            exit 1
          fi

      - name: Determine packages to publish
        id: packages
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG="${{ github.event.inputs.package }}"
          else
            PKG="all"
          fi
          
          if [ "$PKG" = "all" ]; then
            echo "packages=core data-v5 data-v6 data-v7 data-v8 v5 v6 v7 v8 latest compatible" >> $GITHUB_OUTPUT
          else
            echo "packages=$PKG" >> $GITHUB_OUTPUT
          fi

      - name: Build packages
        run: |
          for pkg in ${{ steps.packages.outputs.packages }}; do
            echo "Building packages/$pkg..."
            PKG_NAME=$(grep '^name' packages/$pkg/pyproject.toml | cut -d'"' -f2)
            # compatible package is not a workspace member, build it directly
            if [ "$pkg" = "compatible" ]; then
              uv run python -m build packages/$pkg --outdir packages/$pkg/dist
            else
              uv build --package "$PKG_NAME" --out-dir packages/$pkg/dist
            fi
          done

      - name: Publish to TestPyPI (if enabled)
        if: github.event.inputs.test-pypi == 'true'
        run: |
          for pkg in ${{ steps.packages.outputs.packages }}; do
            echo "Publishing packages/$pkg to TestPyPI..."
            uvx twine upload --repository testpypi packages/$pkg/dist/* || echo "Failed to upload $pkg"
          done
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Wait for TestPyPI propagation
        if: github.event.inputs.test-pypi == 'true'
        run: sleep 60

      - name: Test installation from TestPyPI
        if: github.event.inputs.test-pypi == 'true'
        run: |
          python -m pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            typed-ffmpeg-v8 || echo "TestPyPI installation test completed"

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test-pypi == 'false')
        run: |
          # Publish in order: core first, then version packages, then latest
          PUBLISH_ORDER="core data-v5 data-v6 data-v7 data-v8 v5 v6 v7 v8 latest compatible"

          for pkg in $PUBLISH_ORDER; do
            if echo "${{ steps.packages.outputs.packages }}" | grep -q "$pkg"; then
              echo "Publishing packages/$pkg to PyPI..."
              uvx twine upload packages/$pkg/dist/*
              echo "✅ Published $pkg"
              sleep 10  # Brief pause between packages
            fi
          done
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create release notes
        if: github.event_name == 'release'
        run: |
          echo "# Published Packages" > release-notes.md
          echo "" >> release-notes.md
          for pkg in ${{ steps.packages.outputs.packages }}; do
            if [ -f "packages/$pkg/pyproject.toml" ]; then
              VERSION=$(grep '^version = ' packages/$pkg/pyproject.toml | cut -d'"' -f2)
              NAME=$(grep '^name = ' packages/$pkg/pyproject.toml | cut -d'"' -f2)
              echo "- \`$NAME\` v$VERSION" >> release-notes.md
            fi
          done

      - name: Upload release notes
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
