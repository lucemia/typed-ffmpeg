name: CodeGen - Regenerate Bindings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/scripts/code_gen/templates/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate v${{ matrix.ffmpeg-version }} bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ffmpeg-version: '5'
            ffmpeg-image: 'jrottenberg/ffmpeg:5.1-ubuntu'
          - ffmpeg-version: '6'
            ffmpeg-image: 'jrottenberg/ffmpeg:6.1-ubuntu'
          - ffmpeg-version: '7'
            ffmpeg-image: 'jrottenberg/ffmpeg:7.1-ubuntu'
          - ffmpeg-version: '8'
            ffmpeg-image: 'jrottenberg/ffmpeg:8.0-ubuntu'
          # jrottenberg publishes no 9.x image — use our own full build
          - ffmpeg-version: '9'
            ffmpeg-image: 'ghcr.io/lucemia/typed-ffmpeg/ffmpeg:9.0'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install build tools and FFmpeg runtime dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            nasm yasm build-essential \
            libx264-dev libx265-dev libvpx-dev libmp3lame-dev libopus-dev \
            libvorbis-dev libtheora-dev libwebp-dev libxvidcore-dev \
            libopenjp2-7-dev libopencore-amrnb-dev libopencore-amrwb-dev \
            libass-dev libfreetype6-dev libfontconfig1-dev libfribidi-dev \
            libzimg-dev libaom-dev \
            libssl-dev libsrt-openssl-dev libzmq3-dev \
            libva-dev libdrm-dev ocl-icd-opencl-dev
          sudo apt-get install -y --no-install-recommends \
            libvidstab-dev libdav1d-dev libsvtav1-dev libharfbuzz-dev 2>/dev/null || true

      - name: Extract FFmpeg ${{ matrix.ffmpeg-version }} from Docker image
        run: |
          docker pull ${{ matrix.ffmpeg-image }}
          CONTAINER_ID=$(docker create ${{ matrix.ffmpeg-image }})
          sudo docker cp "$CONTAINER_ID:/usr/local/bin/ffmpeg" /usr/local/bin/ffmpeg || \
            sudo docker cp "$CONTAINER_ID:/usr/bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$CONTAINER_ID:/usr/local/bin/ffprobe" /usr/local/bin/ffprobe || \
            sudo docker cp "$CONTAINER_ID:/usr/bin/ffprobe" /usr/local/bin/ffprobe
          docker cp "$CONTAINER_ID:/usr/local/lib" /tmp/ffmpeg-libs
          sudo cp -a /tmp/ffmpeg-libs/. /usr/local/lib/
          docker rm "$CONTAINER_ID"
          sudo ldconfig
          ffmpeg -version
          echo "--- Filters with hardware acceleration ---"
          ffmpeg -filters 2>/dev/null | grep -iE 'opencl|vulkan|vaapi|ladspa|lv2|cuda' || true

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Generate bindings
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD/src:$PYTHONPATH"
          python -m scripts.code_gen.cli generate \
            --outpath "packages/v${{ matrix.ffmpeg-version }}/src/ffmpeg" \
            --ffmpeg-binary /usr/local/bin/ffmpeg \
            --rebuild

      - name: Upload generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: bindings-v${{ matrix.ffmpeg-version }}
          path: packages/v${{ matrix.ffmpeg-version }}/src/ffmpeg/
          retention-days: 1

      - name: Upload version cache
        uses: actions/upload-artifact@v7
        with:
          name: cache-v${{ matrix.ffmpeg-version }}
          path: packages/core/src/ffmpeg_core/common/cache/list/
          retention-days: 1

  create-pr:
    name: Create PR
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download all generated bindings
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-v*
          path: /tmp/bindings

      - name: Download all version caches
        uses: actions/download-artifact@v8
        with:
          pattern: cache-v*
          path: /tmp/caches

      - name: Apply generated files
        run: |
          for V in 5 6 7 8 9; do
            if [ -d "/tmp/bindings/bindings-v${V}" ]; then
              echo "Applying v${V} bindings..."
              rsync -a --delete "/tmp/bindings/bindings-v${V}/" "packages/v${V}/src/ffmpeg/"
            fi
            if [ -d "/tmp/caches/cache-v${V}" ]; then
              echo "Applying v${V} cache..."
              rsync -a "/tmp/caches/cache-v${V}/" "packages/core/src/ffmpeg_core/common/cache/list/"
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          git diff --stat
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run pre-commit hooks on generated files
        if: steps.changes.outputs.changed == 'true'
        run: |
          pip install uv
          uvx prek run --all-files || true
          uvx prek run --all-files

      - name: Create branch and PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="chore/regenerate-bindings-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/v5/src/ffmpeg/ packages/v6/src/ffmpeg/ packages/v7/src/ffmpeg/ packages/v8/src/ffmpeg/ packages/v9/src/ffmpeg/
          git add packages/core/src/ffmpeg_core/common/cache/list/
          git commit -m "chore: regenerate bindings for FFmpeg v5/v6/v7/v8/v9"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: regenerate bindings for FFmpeg v5/v6/v7/v8/v9" \
            --body "Auto-generated by the [CodeGen workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Uses \`jrottenberg/ffmpeg\` Docker images (5.1, 6.1, 7.1, 8.0), which include VAAPI hardware-accelerated filters, plus our own full 9.0 build." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: echo "No changes detected — bindings are already up to date."
