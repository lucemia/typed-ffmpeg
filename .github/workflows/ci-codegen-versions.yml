name: CI CodeGen - Multi-Version FFmpeg

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-codegen-versions.yml'
      - 'src/scripts/code_gen/**'
      - 'src/scripts/parse_help/**'
      - 'src/scripts/parse_c/**'
      - 'src/scripts/parse_docs/**'
      - 'src/scripts/manual/**'
      - 'packages/core/src/ffmpeg_core/common/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-codegen-versions.yml'
      - 'src/scripts/code_gen/**'
      - 'src/scripts/parse_help/**'
      - 'src/scripts/parse_c/**'
      - 'src/scripts/parse_docs/**'
      - 'src/scripts/manual/**'
      - 'packages/core/src/ffmpeg_core/common/**'
  workflow_dispatch:
    inputs:
      ffmpeg-version:
        description: 'FFmpeg major version to generate (5, 6, 7, 8, 9, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
          - 'all'
      create_pr:
        description: 'Create a PR with the generated bindings against the current branch'
        required: false
        default: 'true'
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ffmpeg-version: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.ffmpeg-version != 'all') && fromJSON(format('["{0}"]', github.event.inputs.ffmpeg-version)) || fromJSON('["5", "6", "7", "8", "9"]') }}

    steps:
      - uses: actions/checkout@v7

      # The image and cache suffix were carried in `matrix.include` keyed on
      # ffmpeg-version, which is also a matrix key. An include entry that
      # cannot merge into any combination is appended as an extra one instead,
      # so narrowing the matrix to a single version still ran all five —
      # dispatching "9" regenerated v5-v8 as well. Resolving here keeps the
      # matrix to exactly what was asked for.
      #
      # mm is the major_minor suffix codegen writes into cache/list/ (e.g.
      # filters_8_0.json). It must match the image tag: globbing on the major
      # alone matches sibling minors like *_8_1.json and mixes versions into
      # one artifact.
      - name: Resolve FFmpeg image and cache suffix
        id: ver
        run: |
          case "${{ matrix.ffmpeg-version }}" in
            5) image='jrottenberg/ffmpeg:5.1-ubuntu'; mm='5_1' ;;
            6) image='jrottenberg/ffmpeg:6.1-ubuntu'; mm='6_1' ;;
            7) image='ghcr.io/lucemia/typed-ffmpeg/ffmpeg:7.1'; mm='7_1' ;;
            8) image='ghcr.io/lucemia/typed-ffmpeg/ffmpeg:8.0'; mm='8_0' ;;
            9) image='ghcr.io/lucemia/typed-ffmpeg/ffmpeg:9.0'; mm='9_0' ;;
            *) echo "::error::No image mapped for v${{ matrix.ffmpeg-version }}"; exit 1 ;;
          esac
          echo "Using $image (cache suffix _$mm)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "mm=$mm" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install build tools and FFmpeg runtime dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            nasm yasm build-essential \
            libx264-dev libx265-dev libvpx-dev libmp3lame-dev libopus-dev \
            libvorbis-dev libtheora-dev libwebp-dev libxvidcore-dev \
            libopenjp2-7-dev libopencore-amrnb-dev libopencore-amrwb-dev \
            libass-dev libfreetype6-dev libfontconfig1-dev libfribidi-dev \
            libzimg-dev libaom-dev \
            libssl-dev libsrt-openssl-dev libzmq3-dev \
            libva-dev libdrm-dev ocl-icd-opencl-dev
          sudo apt-get install -y --no-install-recommends \
            libvidstab-dev libdav1d-dev libsvtav1-dev libharfbuzz-dev 2>/dev/null || true

      - name: Extract FFmpeg ${{ matrix.ffmpeg-version }} from Docker image
        run: |
          docker pull ${{ steps.ver.outputs.image }}
          CONTAINER_ID=$(docker create ${{ steps.ver.outputs.image }})
          sudo docker cp "$CONTAINER_ID:/usr/local/bin/ffmpeg" /usr/local/bin/ffmpeg || \
            sudo docker cp "$CONTAINER_ID:/usr/bin/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$CONTAINER_ID:/usr/local/bin/ffprobe" /usr/local/bin/ffprobe || \
            sudo docker cp "$CONTAINER_ID:/usr/bin/ffprobe" /usr/local/bin/ffprobe
          docker cp "$CONTAINER_ID:/usr/local/lib" /tmp/ffmpeg-libs
          sudo cp -a /tmp/ffmpeg-libs/. /usr/local/lib/
          # Copy system libs from container (custom builds link against system libs)
          docker cp "$CONTAINER_ID:/usr/lib" /tmp/sys-libs
          sudo cp -an /tmp/sys-libs/. /usr/lib/
          docker rm "$CONTAINER_ID"
          sudo ldconfig
          ffmpeg -version
          echo "--- Filter check ---"
          ffmpeg -filters 2>/dev/null | grep -c '^\s' || true
          ffmpeg -filters 2>/dev/null | grep -i drawtext || echo "drawtext: NOT FOUND"
          echo "--- Filters with hardware acceleration ---"
          ffmpeg -filters 2>/dev/null | grep -iE 'opencl|vulkan|vaapi|ladspa|lv2|cuda' || true

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv sync

      - name: Generate versioned bindings
        run: |
          source .venv/bin/activate
          export PYTHONPATH="$PWD/src:$PYTHONPATH"
          export LD_LIBRARY_PATH="/usr/local/lib:/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          FFMPEG_MAJOR=${{ matrix.ffmpeg-version }}
          OUTPATH="packages/v${FFMPEG_MAJOR}/src/ffmpeg"
          echo "Generating bindings for FFmpeg v${FFMPEG_MAJOR} -> ${OUTPATH}"
          python -m scripts.code_gen.cli generate --outpath "$OUTPATH" --rebuild

      - name: Upload generated bindings
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-v${{ matrix.ffmpeg-version }}-bindings
          path: packages/v${{ matrix.ffmpeg-version }}/src/ffmpeg/
          retention-days: 30

      - name: Upload version cache
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-v${{ matrix.ffmpeg-version }}-cache
          path: packages/core/src/ffmpeg_core/common/cache/list/*_${{ steps.ver.outputs.mm }}.json
          retention-days: 30

      - name: Verify generated code imports
        run: |
          source .venv/bin/activate
          uv pip install -e packages/core -e "packages/v${{ matrix.ffmpeg-version }}[dev]"
          FFMPEG_MAJOR=${{ matrix.ffmpeg-version }}
          python -c "
          import ffmpeg
          from ffmpeg import filters, sources
          from ffmpeg.codecs import encoders, decoders
          from ffmpeg.formats import muxers, demuxers
          from ffmpeg.streams import audio, video
          print('All v${FFMPEG_MAJOR} submodules import OK')
          "

      - name: Show generated file stats
        run: |
          FFMPEG_MAJOR=${{ matrix.ffmpeg-version }}
          echo "## Generated files for v${FFMPEG_MAJOR}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find packages/v${FFMPEG_MAJOR}/src/ffmpeg/ -name '*.py' | head -20 >> $GITHUB_STEP_SUMMARY
          find packages/v${FFMPEG_MAJOR}/src/ffmpeg/ -name '*.py' -exec wc -l {} + 2>/dev/null | tail -1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Generated output is applied where the change is, not afterwards. On a PR it
  # is committed straight to the PR branch so templates and their output merge
  # atomically; main never holds generator code without matching bindings.
  # Pushes and manual dispatches still open a PR, since there is no branch to
  # commit back to.
  apply:
    name: Apply generated output
    needs: generate
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.create_pr == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Fork PRs cannot be pushed to with GITHUB_TOKEN.
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # CODEGEN_PAT (a PAT or GitHub App token with `repo` scope) is what
          # makes the bot's commit re-trigger CI. Pushes authenticated with
          # GITHUB_TOKEN deliberately do not start workflow runs, and because
          # check runs are bound to a commit SHA, the new head would carry zero
          # checks — leaving the PR permanently short of the required
          # `CI Status` gate. Falls back to GITHUB_TOKEN with a warning.
          token: ${{ secrets.CODEGEN_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout (fork PR / push / dispatch)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all generated bindings
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-v*-bindings
          path: /tmp/artifacts

      - name: Download all version caches
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-v*-cache
          path: /tmp/artifacts

      - name: Apply generated files
        run: |
          # Versions come from the artifacts the generate matrix actually
          # produced, not a literal list, so a single-version dispatch applies
          # exactly that version and a newly added major needs no edit here.
          # nullglob so a non-matching pattern expands to nothing instead of
          # being passed through as a literal.
          shopt -s nullglob
          VERSIONS=$(for d in /tmp/artifacts/ffmpeg-v*-bindings /tmp/artifacts/ffmpeg-v*-cache; do
            v=${d##*/ffmpeg-v}
            echo "${v%%-*}"
          done | sort -un | tr '\n' ' ')
          if [ -z "$VERSIONS" ]; then
            echo "::error::No generated artifacts were downloaded."
            exit 1
          fi
          echo "Applying versions: $VERSIONS"
          echo "CODEGEN_VERSIONS=$VERSIONS" >> "$GITHUB_ENV"
          for ver in $VERSIONS; do
            bindings_dir="/tmp/artifacts/ffmpeg-v${ver}-bindings"
            cache_dir="/tmp/artifacts/ffmpeg-v${ver}-cache"
            if [ -d "$bindings_dir" ]; then
              echo "Applying v${ver} bindings..."
              mkdir -p "packages/v${ver}/src/ffmpeg"
              cp -r "$bindings_dir/." "packages/v${ver}/src/ffmpeg/"
            fi
            if [ -d "$cache_dir" ]; then
              echo "Applying v${ver} cache..."
              mkdir -p "packages/core/src/ffmpeg_core/common/cache/list"
              cp "$cache_dir"/*.json "packages/core/src/ffmpeg_core/common/cache/list/" 2>/dev/null || true

              # packages/core/.../cache/list is NOT shipped (include-package-data
              # = false), so installed users read this data from the published
              # ffmpeg-data-vN package instead. Mirror it there or the release
              # silently keeps whatever was committed by hand.
              # Suffixed name -> shipped name: filters_8_0.json -> filters.json
              mm=$(basename "$(ls "$cache_dir"/filters_*.json 2>/dev/null | head -1)" .json | sed 's/^filters_//')
              data_dir="packages/data-v${ver}/src/ffmpeg_data_v${ver}/cache/list"
              if [ -n "$mm" ] && [ -d "$data_dir" ]; then
                echo "  mirroring v${ver} cache (${mm}) -> ${data_dir}"
                for src in "$cache_dir"/*_"${mm}".json; do
                  [ -e "$src" ] || continue
                  cp "$src" "${data_dir}/$(basename "$src" | sed "s/_${mm}\.json\$/.json/")"
                done
              else
                echo "  WARNING: no cache mirror for v${ver} (mm='${mm}', dir='${data_dir}')"
              fi
            fi
          done

      # Raw generator output is not formatted, but prek's hooks cover
      # ^(src/|packages/), so committing it unformatted produces an enormous
      # diff that is ~99% churn (40,848 differing lines in one file vs 228
      # after ruff format) and gets rewritten by the next local prek run.
      # Must run BEFORE change detection, so a formatting-only delta does not
      # register as a real change.
      - name: Format generated files
        run: |
          pip install uv
          # Hooks rewrite files in place, so the first pass exits non-zero by
          # design; the second pass verifies everything is clean.
          uvx prek run --all-files || true
          uvx prek run --all-files

      - name: Check for changes
        id: check-changes
        run: |
          # Stage first: `git diff` alone only sees tracked files, so a newly
          # generated module (a new filter, a new format) would be reported as
          # "no changes" and silently dropped.
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected — bindings are already up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      # PR, same repo: commit the output onto the PR branch so it merges as one
      # change.
      - name: Commit generated output to PR branch
        if: >-
          steps.check-changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request' && env.IS_FORK == 'false'
        run: |
          if [ -z "${{ secrets.CODEGEN_PAT }}" ]; then
            echo "::warning::CODEGEN_PAT is not set, so this commit is pushed with"
            echo "::warning::GITHUB_TOKEN and will NOT re-trigger CI. Check runs are"
            echo "::warning::bound to a commit SHA, so the new head will report zero"
            echo "::warning::checks and cannot satisfy the required CI Status gate."
            echo "::warning::Add a CODEGEN_PAT secret (repo scope) to fix this."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate FFmpeg bindings

          Applied automatically by the CI CodeGen workflow so the generator
          change and its output land in a single merge."
          git push origin "HEAD:${{ github.head_ref }}"

      # Fork PR: we cannot push to the contributor's branch, so make the
      # staleness loud instead of silently dropping the output.
      - name: Report stale generated output (fork PR)
        if: >-
          steps.check-changes.outputs.has_changes == 'true' &&
          github.event_name == 'pull_request' && env.IS_FORK == 'true'
        run: |
          echo "::error::Generated output is out of date for this change."
          echo "This PR is from a fork, so CI cannot commit the regenerated"
          echo "bindings for you. Regenerate locally and include them:"
          echo "  python -m scripts.code_gen.cli generate \\"
          echo "    --outpath packages/vN/src/ffmpeg --ffmpeg-binary \$(which ffmpeg) --rebuild"
          git diff --stat
          exit 1

      - name: Create PR with updated bindings
        if: >-
          steps.check-changes.outputs.has_changes == 'true' &&
          github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/regen-bindings-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          # CODEGEN_VERSIONS ("5 6 7 8 9") is set by the apply step, so a
          # single-version dispatch is titled for that version alone.
          SLASHED=""; COMMA_LIST=""
          for ver in $CODEGEN_VERSIONS; do
            SLASHED="${SLASHED:+$SLASHED/}v${ver}"
            COMMA_LIST="${COMMA_LIST:+$COMMA_LIST, }v${ver}"
          done
          git commit -m "chore: regenerate FFmpeg bindings for ${SLASHED}"
          git push origin "$BRANCH"
          gh pr create \
            --base ${{ github.ref_name }} \
            --head "$BRANCH" \
            --title "chore: regenerate FFmpeg bindings" \
            --body "Auto-generated by [CI CodeGen workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Updates FFmpeg bindings for ${COMMA_LIST} using pre-built Docker images with hardware filter support (VAAPI, OpenCL, etc.)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
