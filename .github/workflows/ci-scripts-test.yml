name: CI Scripts - Test

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'src/scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'src/scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install GCC and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm ffmpeg && ffmpeg -version

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest src/scripts --cov=./src/scripts --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: scripts,python-3.10
          name: scripts-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
